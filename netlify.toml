[build]
  command = "node tools/seo-build.mjs"
  publish = "."

[functions]
  directory = "netlify/functions"

# One canonical free offer; keep legacy campaign booking URLs working.
[[redirects]]
  from = "/book-free-call"
  to = "/free-consultation"
  status = 301
  force = true

[[redirects]]
  from = "/book-free-call.html"
  to = "/free-consultation"
  status = 301
  force = true

[[redirects]]
  from = "/free-consultation"
  to = "/free-consultation.html"
  status = 200

[[redirects]]
  from = "/for-schools"
  to = "/for-schools.html"
  status = 200

[[redirects]]
  from = "/thank-you"
  to = "/thank-you.html"
  status = 200

[[redirects]]
  from = "/Parent_Shield_Landing_Page.html"
  to = "/ehcp-advisory"
  status = 301
  force = true
[[redirects]]
  from = "/Parent_Shield_Landing_Page"
  to = "/ehcp-advisory"
  status = 301
  force = true

[[redirects]]
  from = "/parent_shield_landing_page.html"
  to = "/ehcp-advisory"
  status = 301
  force = true

[[redirects]]
  from = "/parent_shield_landing_page"
  to = "/ehcp-advisory"
  status = 301
  force = true
